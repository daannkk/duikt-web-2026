
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Українська клавіатура</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="keyboard">

    <div class="function-row">
        <button class="key">Esc</button>

        <div class="f-group">
            <button class="key">F1</button>
            <button class="key">F2</button>
            <button class="key">F3</button>
            <button class="key">F4</button>
        </div>

        <div class="f-group">
            <button class="key">F5</button>
            <button class="key">F6</button>
            <button class="key">F7</button>
            <button class="key">F8</button>
        </div>

        <div class="f-group">
            <button class="key">F9</button>
            <button class="key">F10</button>
            <button class="key">F11</button>
            <button class="key">F12</button>
        </div>

        <div class="extra-keys">
            <button class="key">PrtSc</button>
            <button class="key">Scroll</button>
            <button class="key">Pause</button>
        </div>
    </div>

    <div class="main">

        <div class="row">
            <button class="key">~</button>
            <button class="key">1</button>
            <button class="key">2</button>
            <button class="key">3</button>
            <button class="key">4</button>
            <button class="key">5</button>
            <button class="key">6</button>
            <button class="key">7</button>
            <button class="key">8</button>
            <button class="key">9</button>
            <button class="key">0</button>
            <button class="key">-</button>
            <button class="key">=</button>
            <button class="key wide"><-</button>
        </div>

        <div class="row">
            <button class="key wide">Tab</button>
            <button class="key">Й</button>
            <button class="key">Ц</button>
            <button class="key">У</button>
            <button class="key">К</button>
            <button class="key">Е</button>
            <button class="key">Н</button>
            <button class="key">Г</button>
            <button class="key">Ш</button>
            <button class="key">Щ</button>
            <button class="key">З</button>
            <button class="key">Х</button>
            <button class="key">Ї</button>
            <button class="key">\</button>
        </div>

        <div class="row">
            <button class="key wide">Caps</button>
            <button class="key">Ф</button>
            <button class="key">І</button>
            <button class="key">В</button>
            <button class="key">А</button>
            <button class="key">П</button>
            <button class="key">Р</button>
            <button class="key">О</button>
            <button class="key">Л</button>
            <button class="key">Д</button>
            <button class="key">Ж</button>
            <button class="key">Є</button>
            <button class="key extra-wide">Enter</button>
        </div>

        <div class="row">
            <button class="key extra-wide">Shift</button>
            <button class="key">Я</button>
            <button class="key">Ч</button>
            <button class="key">С</button>
            <button class="key">М</button>
            <button class="key">И</button>
            <button class="key">Т</button>
            <button class="key">Ь</button>
            <button class="key">Б</button>
            <button class="key">Ю</button>
            <button class="key">.</button>
            <button class="key extra-wide">Shift</button>
        </div>

        <div class="row bottom-row">
            <button class="key">Ctrl</button>
            <button class="key">Win</button>
            <button class="key">Alt</button>
            <button class="key space"></button>
            <button class="key">Alt</button>
            <button class="key">Fn</button>
            <button class="key">Ctrl</button>
        </div>

    </div>

    <div class="navigation">

        <div class="row">
            <button class="key">Ins</button>
            <button class="key">Home</button>
            <button class="key">PgUp</button>
        </div>

        <div class="row">
            <button class="key">Del</button>
            <button class="key">End</button>
            <button class="key">PgDn</button>
        </div>

        <div class="arrows">
            <button class="key">↑</button>

            <div class="row">
                <button class="key">←</button>
                <button class="key">↓</button>
                <button class="key">→</button>
            </div>
        </div>

    </div>

    <div class="numpad">

        <div class="row">
            <button class="key">Num</button>
            <button class="key">/</button>
            <button class="key">*</button>
            <button class="key">-</button>
        </div>

        <div class="row">
            <button class="key">7</button>
            <button class="key">8</button>
            <button class="key">9</button>
            <button class="key tall">+</button>
        </div>

        <div class="row">
            <button class="key">4</button>
            <button class="key">5</button>
            <button class="key">6</button>
        </div>

        <div class="row">
            <button class="key">1</button>
            <button class="key">2</button>
            <button class="key">3</button>
            <button class="key tall">Enter</button>
        </div>

        <div class="row">
            <button class="key double">0</button>
            <button class="key">.</button>
        </div>

    </div>

</div>

</body>
</html>
