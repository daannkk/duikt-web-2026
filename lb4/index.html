
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>WEEKLY PLAN</title>
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <header class="header">

            <h1 class="title">WEEKLY PLAN</h1>

            <div class="week">
                <span>WEEK OF</span>
                <input type="text">
            </div>

            <div class="habit">
                <span>HEALTHY HABIT</span>
                <input type="text">
            </div>

            <div class="improvement">
                <span>ROOM FOR IMPROVEMENT</span>
                <input type="checkbox">
            </div>

            <div class="rocked">
                <span>ROCKED IT</span>
                <input type="checkbox">
            </div>

        </header>

        <!-- MAIN -->
        <main class="main">

            <!-- SIDEBAR -->
            <aside class="sidebar">

                <div class="sidebar-label">TO DO</div>

                <section class="task-section">

                    <h3>TOP 3 GOALS</h3>

                    <div class="task-list">
                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>
                    </div>

                </section>

                <section class="task-section">

                    <h3>EVERYTHING ELSE</h3>

                    <div class="task-list">

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                    </div>

                </section>

                <section class="task-section">

                    <h3>NEXT WEEK</h3>

                    <div class="task-list">

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                        <div class="task">
                            <input type="checkbox">
                            <input type="text">
                        </div>

                    </div>

                </section>

            </aside>

            <!-- CALENDAR -->
            <section class="calendar">

                <div class="day monday">
                    <div class="day-header">
                        <h3>MONDAY</h3>
                        <input type="checkbox">
                    </div>
                    <textarea></textarea>
                </div>

                <div class="day tuesday">
                    <div class="day-header">
                        <h3>TUESDAY</h3>
                        <input type="checkbox">
                    </div>
                    <textarea></textarea>
                </div>

                <div class="day wednesday">
                    <div class="day-header">
                        <h3>WEDNESDAY</h3>
                        <input type="checkbox">
                    </div>
                    <textarea></textarea>
                </div>

                <div class="day thursday">
                    <div class="day-header">
                        <h3>THURSDAY</h3>
                        <input type="checkbox">
                    </div>
                    <textarea></textarea>
                </div>

                <div class="day friday">
                    <div class="day-header">
                        <h3>FRIDAY</h3>
                        <input type="checkbox">
                    </div>
                    <textarea></textarea>
                </div>

                <div class="day saturday">
                    <div class="day-header">
                        <h3>SATURDAY</h3>
                        <input type="checkbox">
                    </div>
                    <textarea></textarea>
                </div>

                <div class="day sunday">
                    <div class="day-header">
                        <h3>SUNDAY</h3>
                        <input type="checkbox">
                    </div>
                    <textarea></textarea>
